name: 🐛 Bug Report
description: File a bug report
type: bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for submitting a bug report! This issue tracker is for [Desktop Plus](https://github.com/desktop-plus/desktop-plus). Please search the issue tracker to see if there is an existing issue for the bug you are reporting.
  - type: checkboxes
    id: ai-policy-acknowledgement
    attributes:
      label: AI Policy Acknowledgement
      description: |
        #### **Important:** Make sure you have read our [AI policy](https://desktop-plus.org/ai-policy) before submitting this feature request. Any submissions that violate it may be closed without further discussion.
      options:
        - label: I have read and understood the AI policy.
          required: true
    validations:
      required: true
  - type: textarea
    id: the-problem
    attributes:
      label: The problem
      description:
        Describe the issue you are experiencing with Desktop Plus. Provide a
        clear and concise description of what you were trying to do and what
        happened, along with any error messages you encountered.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Release version
      description:
        Open 'Help' -> 'About Desktop Plus' menu item to see the app version.
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: Operating system and distro
      description:
        'Enter the specific operating system version you are running (example:
        Windows 10, Ubuntu 20.04)'
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce the behavior
      description: Provide steps to reproduce the problem you are experiencing.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
  - type: input
    id: specific-to-desktop-plus
    attributes:
      label: Specific to Desktop Plus?
      description:
        Download the [official GitHub Desktop app](https://desktop.github.com).
        Does the issue also occur there, or is it specific to Desktop Plus?
  - type: textarea
    id: logs
    attributes:
      label: Log files
      description:
        Please upload a log file from a day you experienced the issue. To access
        the log files go to the menu and select `Help` > `Show Logs`.
      placeholder:
        You can attach log files by clicking this area to highlight it and then
        dragging the files in.
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Add screenshots to help explain your problem, if applicable.
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description:
        Add any other context about the problem you are experiencing here.
